# ============================================================
# mosquitto.conf
# MQTT Broker Configuration (Local Development)
# ============================================================

# ------------------------------------------------------------
# Per-listener settings: FALSE so auth + routing apply
# globally (not isolated per listener). This allows
# messages from listener 8883 (TLS) to be consumed on 1883.
# ------------------------------------------------------------
per_listener_settings false

# ------------------------------------------------------------
# Listener 1: Plaintext (internal only)
# Bound exclusively to host localhost via docker-compose
# (127.0.0.1:1883:1883), consumed by local FastAPI backend.
# Not exposed to public internet.
# ------------------------------------------------------------
listener 1883

# ------------------------------------------------------------
# Listener 2: TLS (disabled for local development)
# ------------------------------------------------------------
# listener 8883
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem
# tls_version tlsv1.2

# ------------------------------------------------------------
# Authentication (applies globally because per_listener_settings is false)
# ------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ------------------------------------------------------------
# Persistence
# ------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

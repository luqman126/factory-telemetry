# ============================================================
# mosquitto.conf
# Konfigurasi MQTT broker
# ============================================================

# ------------------------------------------------------------
# Per-listener settings: FALSE supaya auth + routing berlaku
# global (tidak isolated per listener). Ini yang memungkinkan
# message dari listener 8883 (TLS) diterima subscriber di 1883.
# ------------------------------------------------------------
per_listener_settings false

# ------------------------------------------------------------
# Listener 1: Plaintext (internal only)
# Di-publish hanya ke host localhost via docker-compose
# (127.0.0.1:1883:1883), dipakai backend FastAPI lokal.
# Tidak exposed ke internet.
# ------------------------------------------------------------
listener 1883

# ------------------------------------------------------------
# Listener 2: TLS (untuk IoT device eksternal via internet)
# Cert dari Let's Encrypt, di-copy ke /mosquitto/certs/
# oleh deploy-mqtt-cert.sh (owned UID 1883).
# ------------------------------------------------------------
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# ------------------------------------------------------------
# Authentication (berlaku global karena per_listener_settings false)
# ------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ------------------------------------------------------------
# Persistence
# ------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

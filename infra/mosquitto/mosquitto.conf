# ============================================================
# mosquitto.conf
# Konfigurasi MQTT broker untuk local development
# ============================================================

# ------------------------------------------------------------
# Listener MQTT standar
# Port 1883 adalah port default MQTT (unencrypted)
# Ini yang dipakai backend dan simulator untuk connect
# ------------------------------------------------------------
listener 1883
allow_anonymous true

# ------------------------------------------------------------
# Persistence
# Supaya pesan yang belum terdeliver tidak hilang kalau
# broker restart (misalnya container di-restart)
# ------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------
# Logging
# stdout supaya log muncul di docker compose logs
# file sebagai backup log permanen di dalam container
# ------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
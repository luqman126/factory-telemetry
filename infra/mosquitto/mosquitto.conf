# ============================================================
# mosquitto.conf
# Konfigurasi MQTT broker
# ============================================================

# ------------------------------------------------------------
# Listener
# ------------------------------------------------------------
listener 1883

# ------------------------------------------------------------
# Authentication
# Set allow_anonymous true untuk development tanpa auth
# Untuk production: set false dan gunakan password_file
# Generate password: mosquitto_passwd -c /mosquitto/config/passwd <username>
# ------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd

# ------------------------------------------------------------
# Persistence
# ------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ============================================================
# prometheus.yml
# Prometheus Configuration for IoT Big Data Project
# ============================================================

global:
  scrape_interval:     15s # Default scrape interval
  evaluation_interval: 15s # Default evaluation interval

# Alertmanager configuration (optional for future expansion)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (optional for alert rules)
rule_files:
  # - "alert.rules_yml"

scrape_configs:
  # ----------------------------------------------------------
  # 1. Prometheus Server self-monitoring (PULL Model)
  #    Monitors Prometheus server metrics
  # ----------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ARCHITECTURAL NOTE:
  # Host system metrics (CPU, RAM, Disk) and Postgres database metrics
  # from datalayer-1 and datalayer-2 are not scraped (PULL) directly from here.
  # Instead, they are actively forwarded (PUSH) by Grafana Alloy
  # via the Prometheus remote write receiver endpoint on port 9090.
  #
  # Consequently, inbound monitoring ports do not need to be exposed
  # on the database AWS Security Groups, maintaining strict network isolation.


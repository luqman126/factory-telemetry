services:

  # ----------------------------------------------------------
  # Mosquitto
  # ----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # plaintext, hanya host localhost (backend)
      - "8883:8883"             # TLS, exposed ke internet (IoT device)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_net

  # ----------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    depends_on:
      - timescaledb
    restart: unless-stopped
    environment:
      # Grafana user for admin role
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Database
      POSTGRES_USER:              ${POSTGRES_USER}
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
      POSTGRES_DB:                ${POSTGRES_DB}
      POSTGRES_HOST:              ${POSTGRES_HOST}
      POSTGRES_HOST_REPLICA:      ${POSTGRES_HOST_REPLICA:-${POSTGRES_HOST}}
      POSTGRES_PORT:              ${POSTGRES_PORT:-5432}
      
      TELEGRAM_BOT_TOKEN_IOT:     ${TELEGRAM_BOT_TOKEN_IOT}
      TELEGRAM_CHAT_ID_IOT:       ${TELEGRAM_CHAT_ID_IOT}
      TELEGRAM_BOT_TOKEN_SERVER:  ${TELEGRAM_BOT_TOKEN_SERVER}
      TELEGRAM_CHAT_ID_SERVER:    ${TELEGRAM_CHAT_ID_SERVER}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - iot_net

  # ----------------------------------------------------------
  # Prometheus
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: iot_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - iot_net
  
  # ----------------------------------------------------------
  # Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: iot-backend:latest
    container_name: iot_backend
    depends_on:
      - mosquitto
      - timescaledb
    restart: unless-stopped
    environment:
      # Database
      POSTGRES_DB:        ${POSTGRES_DB}
      POSTGRES_USER:      ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
      POSTGRES_HOST:      ${POSTGRES_HOST}
      POSTGRES_PORT:      ${POSTGRES_PORT}
      # MQTT (Points to the container name 'mosquitto' on iot_net)
      MQTT_BROKER_HOST:   mosquitto
      MQTT_BROKER_PORT:   ${MQTT_BROKER_PORT}
      MQTT_TOPIC_PREFIX:  ${MQTT_TOPIC_PREFIX}
      MQTT_USER:          ${MQTT_USER}
      MQTT_PASSWORD:      ${MQTT_PASSWORD} 
      # Logging
      LOG_LEVEL:          ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000" # Local access only
    networks:
      - iot_net

networks:
  iot_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  grafana_data:
  prometheus_data:
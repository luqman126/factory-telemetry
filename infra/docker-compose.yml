# ============================================================
# docker-compose.yml
# Base services untuk local development
# Dijalankan dari direktori infra/
#
# Sebelum menjalankan:
#   cp .env.example .env
#   isi kredensial di .env
# ============================================================

services:

  # ----------------------------------------------------------
  # Mosquitto
  # ----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # plaintext, hanya host localhost (backend)
      - "8883:8883"             # TLS, exposed ke internet (IoT device)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_net

  # ----------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      POSTGRES_USER:              ${POSTGRES_USER}
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
      POSTGRES_DB:                ${POSTGRES_DB}
      POSTGRES_HOST:              ${POSTGRES_HOST}
      POSTGRES_HOST_REPLICA:      ${POSTGRES_HOST_REPLICA:-${POSTGRES_HOST}}
      POSTGRES_PORT:              ${POSTGRES_PORT:-5432}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - iot_net

networks:
  iot_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  grafana_data:
---
# 1. Start etcd DCS on applayer FIRST so Patroni has a DCS cluster to connect to
- name: Provision Distributed Consensus (etcd)
  hosts: app_nodes
  become: true
  roles:
    - role: etcd
      tags: etcd


# 2. Provision Primary Database Node
- name: Provision Primary Database Node
  hosts: db_primary
  become: true
  vars:
    alloy_enable_postgres: true
    alloy_instance_name: "datalayer-1"
  roles:
    - timescaledb_primary
    - alloy_agent
    - role: patroni
      tags: patroni

# 3. Provision Standby Replica (Patroni auto-bootstraps replication from leader)
- name: Provision Standby Replica Database Node
  hosts: db_replica
  become: true
  vars:
    alloy_enable_postgres: true
    alloy_instance_name: "datalayer-2"
  roles:
    # timescaledb_replica is NOT needed — Patroni handles replication automatically
    - alloy_agent
    - role: patroni
      tags: patroni

# 4. Provision Application & Monitoring Node
- name: Provision Application & Monitoring Node
  hosts: app_nodes
  become: true
  vars:
    alloy_enable_postgres: false
    alloy_instance_name: "applayer-1"
    prometheus_ip: "127.0.0.1"
  roles:
    - role: haproxy
      tags: haproxy
    - role: applayer
      tags: applayer
    - role: alloy_agent
      tags: alloy_agent


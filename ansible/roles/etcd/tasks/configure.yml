---
- name: Deploy etcd configuration file
  ansible.builtin.template:
    src: etcd.conf.yml.j2
    dest: "{{  etcd_conf_dir  }}/etcd.conf.yml"
    owner: etcd
    group: etcd
    mode: '0640'
  notify: Restart etcd

- name: Deploy etcd systemd unit file
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart etcd

- name: Ensure etcd service is started and enabled
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true
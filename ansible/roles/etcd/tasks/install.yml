- name: Create etcd system group
  ansible.builtin.group:
    name: etcd
    system: true
    state: present

- name: Create etcd system user
  ansible.builtin.user:
    name: etcd
    group: etcd
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create etcd directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: '0750'
  loop:
    - "{{ etcd_data_dir }}"
    - "{{ etcd_conf_dir }}"

- name: Download and extract etcd binary
  ansible.builtin.unarchive:
    src: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/etcd-v{{ etcd_version }}-linux-amd64"

- name: Copy etcd and etcdctl binaries to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    owner: root
    group: root
    remote_src: true
  loop:
    - etcd
    - etcdctl
    - etcdutl
- name: Configure Grafama RPM Repository
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana Official Repository
    baseurl: https://rpm.grafana.com
    gpgcheck: true
    gpgkey: https://rpm.grafana.com/gpg.key
    enabled: true

- name: Install Grafana Alloy agent
  ansible.builtin.dnf:
    name: alloy
    state: present

- name: Deploy Grafana Alloy configuration file
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: '0644'

- name: Ensure Alloy agent is started and enabled
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true
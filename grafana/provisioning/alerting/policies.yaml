apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram-alert-iot
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      - receiver: telegram-alert-server
        object_matchers:
          - [ category, =, server ]
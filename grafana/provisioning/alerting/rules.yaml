apiVersion: 1

groups:
  - orgId: 1
    name: iot-alerts
    folder: IoT
    interval: 1m

    rules:

      # ----------------------------------------------------------
      # Suhu tinggi — berlaku semua ruangan
      # Critical threshold: 35°C (sesuai DATA_CONTRACT)
      # ----------------------------------------------------------
      - uid: high-temperature
        title: High Temperature Detected
        condition: C
        data:
          - refId: A
            datasourceUid: P40AE60E18F02DE32
            relativeTimeRange:
              from: 150
              to: 0
            model:
              datasource:
                type: postgres
                uid: P40AE60E18F02DE32
              editorMode: code
              format: table
              rawSql: |
                SELECT
                  avg(temperature) as temperature
                FROM sensor_readings
                WHERE time >= NOW() - INTERVAL '1 minute'
                AND temperature IS NOT NULL;
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [35]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Suhu tinggi terdeteksi"
          description: "Rata-rata suhu 1 menit terakhir melebihi 35°C"
        labels:
          severity: critical

      # ----------------------------------------------------------
      # Kadar uap flux berbahaya — ruang penyolderan
      # Critical threshold: 75 ppm (sesuai DATA_CONTRACT)
      # ----------------------------------------------------------
      - uid: gas-hazard
        title: Hazardous Gas Detected
        condition: C
        data:
          - refId: A
            datasourceUid: P40AE60E18F02DE32
            relativeTimeRange:
              from: 150
              to: 0            
            model:
              datasource:
                type: postgres
                uid: P40AE60E18F02DE32
              editorMode: code
              format: table
              rawSql: |
                SELECT
                  COUNT(*)::double precision as hazardous_count
                FROM sensor_readings
                WHERE time >= NOW() - INTERVAL '1 minute'
                AND voc_level = 'HAZARDOUS';
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Gas berbahaya terdeteksi"
          description: "Terdeteksi status HAZARDOUS pada sensor gas dalam 1 menit terakhir"
        labels:
          severity: critical

      # ----------------------------------------------------------
      # Getaran berlebih — ruang produksi
      # Critical threshold: 5 m/s² (sesuai DATA_CONTRACT)
      # ----------------------------------------------------------
      - uid: high-vibration
        title: Excessive Vibration Detected
        condition: C
        data:
          - refId: A
            datasourceUid: P40AE60E18F02DE32
            relativeTimeRange:
              from: 150
              to: 0            
            model:
              datasource:
                type: postgres
                uid: P40AE60E18F02DE32
              editorMode: code
              format: table
              rawSql: |
                SELECT
                  avg(vibration_rms) as vibration_rms
                FROM sensor_readings
                WHERE time >= NOW() - INTERVAL '1 minute'
                AND vibration_rms IS NOT NULL
                AND location = 'ruang_produksi';              
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Getaran berlebih terdeteksi"
          description: "Rata-rata vibration_rms 1 menit terakhir melebihi 0 (terdeteksi getaran) di ruang produksi"
        labels:
          severity: critical

  - orgId: 1
    name: server-alerts
    folder: Server
    interval: 1m
    rules:

      # ----------------------------------------------------------
      # CPU Usage Tinggi (> 85%) selama 5 menit
      # ----------------------------------------------------------
      - uid: server-high-cpu
        title: Server High CPU Usage
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              editorMode: code
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "CPU Usage Tinggi"
          description: "Penggunaan CPU pada server {{ $labels.instance }} melebihi 85% selama 5 menit terakhir."
        labels:
          severity: warning
          category: server

      # ----------------------------------------------------------
      # RAM Usage Tinggi (> 85%) selama 5 menit
      # ----------------------------------------------------------
      - uid: server-high-ram
        title: Server High RAM Usage
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              editorMode: code
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "RAM Usage Tinggi"
          description: "Penggunaan RAM pada server {{ $labels.instance }} melebihi 85% selama 5 menit terakhir."
        labels:
          severity: warning
          category: server

      # ----------------------------------------------------------
      # Disk Space Rendah (< 10%) selama 5 menit
      # ----------------------------------------------------------
      - uid: server-low-disk
        title: Server Disk Space Low
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: (node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
              editorMode: code
              range: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [10]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Disk Space Rendah"
          description: "Sisa kapasitas disk pada server {{ $labels.instance }} di mountpoint '/' kurang dari 10%."
        labels:
          severity: critical
          category: server

      # ----------------------------------------------------------
      # Replikasi Database Terhambat (> 10MB)
      # ----------------------------------------------------------
      - uid: db-replication-lag
        title: Database Replication Lag High
        condition: C
        data:
          - refId: A
            datasourceUid: P40AE60E18F02DE32
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: postgres
                uid: P40AE60E18F02DE32
              editorMode: code
              format: table
              rawSql: |
                SELECT
                  COALESCE((SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) FROM pg_stat_replication LIMIT 1), 0)::double precision AS lag_bytes;
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [10485760] # 10MB
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Replikasi Database Terhambat"
          description: "Replication lag antara datalayer-1 dan datalayer-2 melebihi 10MB."
        labels:
          severity: warning
          category: server

      # ----------------------------------------------------------
      # Database Replica Terputus
      # ----------------------------------------------------------
      - uid: db-replica-disconnected
        title: Database Replica Disconnected
        condition: C
        data:
          - refId: A
            datasourceUid: P40AE60E18F02DE32
            relativeTimeRange:
              from: 150
              to: 0
            model:
              datasource:
                type: postgres
                uid: P40AE60E18F02DE32
              editorMode: code
              format: table
              rawSql: |
                SELECT
                  COUNT(*)::double precision AS replica_count
                FROM pg_stat_replication;
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Database Replica Terputus"
          description: "Tidak terdeteksi adanya active streaming replica (datalayer-2) pada datalayer-1."
        labels:
          severity: critical
          category: server
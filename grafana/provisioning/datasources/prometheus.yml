# ============================================================
# grafana/provisioning/datasources/prometheus.yml
# Grafana datasource configuration for Prometheus Server
# Automatically provisioned on container startup
# ============================================================

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090  # Internal Docker bridge network connection (iot_net)
    jsonData:
      httpMethod: POST
    isDefault: false
    editable: false

# ============================================================
# grafana/provisioning/datasources/timescaledb.yml
# Konfigurasi datasource Grafana ke TimescaleDB
# Otomatis di-load saat Grafana container start
#
# Strategy:
# - TimescaleDB (primary)  → write workload + alert rules
# - TimescaleDB-Replica    → dashboard read query (default)
#
# Alert rules tetap reference primary UID (P40AE60E18F02DE32) untuk
# memastikan evaluasi alert membaca data terbaru tanpa replication lag.
# ============================================================

apiVersion: 1

datasources:
  # ----------------------------------------------------------
  # PRIMARY (datalayer-1) — write target + alert evaluation
  # ----------------------------------------------------------
  - name: TimescaleDB
    uid: P40AE60E18F02DE32
    type: postgres
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: false
    editable: false

  # ----------------------------------------------------------
  # REPLICA (datalayer-2) — read-only, untuk dashboard panel
  # ----------------------------------------------------------
  - name: TimescaleDB-Replica
    uid: timescaledb-replica
    type: postgres
    url: ${POSTGRES_HOST_REPLICA}:${POSTGRES_PORT_REPLICA}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false

# ============================================================
# grafana/provisioning/datasources/timescaledb.yml
# Konfigurasi datasource Grafana ke TimescaleDB
# Otomatis di-load saat Grafana container start
# ============================================================

apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    url: iot_timescaledb:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false
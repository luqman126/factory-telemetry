# ============================================================
# grafana/provisioning/datasources/timescaledb.yml
# Grafana datasource configuration for TimescaleDB
# Automatically provisioned on container startup
#
# Strategy:
# - TimescaleDB (primary)  → write workload + alert rules
# - TimescaleDB-Replica    → dashboard read query (default)
#
# Alert rules continue referencing primary UID (P40AE60E18F02DE32) to
# guarantee alert evaluation evaluates real-time data with zero replication lag.
# ============================================================

apiVersion: 1

datasources:
  # ----------------------------------------------------------
  # PRIMARY (datalayer-1 via HAProxy:5000) — write target + alert evaluation
  # ----------------------------------------------------------
  - name: TimescaleDB
    uid: P40AE60E18F02DE32
    type: postgres
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: false
    editable: false

  # ----------------------------------------------------------
  # REPLICA (datalayer-2 via HAProxy:5001) — read-only for dashboard panels
  # ----------------------------------------------------------
  - name: TimescaleDB-Replica
    uid: timescaledb-replica
    type: postgres
    url: ${POSTGRES_HOST_REPLICA}:${POSTGRES_PORT_REPLICA}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false

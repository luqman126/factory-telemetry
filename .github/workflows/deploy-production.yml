name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy Code via Rsync
        run: |
          # 1. Prepare SSH key on Runner
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Create destination folder on server if not present & ensure ownership by ec2-user
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "mkdir -p /home/ec2-user/factory-telemetry && sudo chown -R ec2-user:ec2-user /home/ec2-user/factory-telemetry"

          # 3. Synchronize repository files using rsync (exclude git, terraform, environments)
          echo "-> Pushing code to production server..."
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'infra/.env' \
            --exclude 'infra/terraform/' \
            --exclude 'backend/.venv/' \
            --exclude 'simulator/.venv/' \
            --exclude 'spark-jobs/.venv/' \
            --exclude 'spark-jobs/data/' \
            --exclude '*/__pycache__/' \
            --exclude 'infra/docker-compose.override.yml' \
            ./ ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/home/ec2-user/factory-telemetry/

      - name: Copy Temporary Deploy Key to Bastion
        run: |
          echo "-> Copying SSH Key to Bastion for DB access..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/home/ec2-user/tmp-key.pem
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "chmod 600 /home/ec2-user/tmp-key.pem"

      - name: Restart Services via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          script: |
            echo "=== EXECUTING POST-DEPLOYMENT SETUP ==="
            cd /home/ec2-user/factory-telemetry

            # 0a. Fetch Secrets from SSM Parameter Store into .env
            echo "-> Fetching environment secrets from AWS SSM..."
            chmod +x infra/scripts/fetch-secrets.sh
            ./infra/scripts/fetch-secrets.sh production
            source infra/.env

            # 0b. Clean up legacy iot-backend.service if present
            sudo systemctl stop iot-backend.service || true
            sudo systemctl disable iot-backend.service || true
            sudo rm -f /etc/systemd/system/iot-backend.service
            sudo systemctl daemon-reload

            # 0c. Run Database Migrations
            echo "-> Applying database migrations..."
            if [ -d "db/migrations" ]; then
              docker build --target migrations -t iot-migrations:latest ./backend

              docker run --rm \
              --name iot_migrations \
              --network host \
              --env-file infra/.env \
              -v "$PWD/db/migrations:/migrations:ro" \
              -v "$PWD/db/run_migrations.sh:/run_migrations.sh:ro" \
              iot-migrations:latest \
              /bin/sh /run_migrations.sh
            fi

            # 1. Setup & Enable systemd service & timer for Spark Analytics
            echo "-> Setting up systemd iot-analytics service and timer..."
            sudo chmod +x /home/ec2-user/factory-telemetry/spark-jobs/run_hourly_pipeline.sh
            sudo cp /home/ec2-user/factory-telemetry/infra/systemd/iot-analytics.service /etc/systemd/system/
            sudo cp /home/ec2-user/factory-telemetry/infra/systemd/iot-analytics.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now iot-analytics.timer

            # 2. Restart Docker Compose services (Mosquitto, Grafana, Prometheus, Backend)
            echo "-> Restarting Docker Compose containers..."
            cd /home/ec2-user/factory-telemetry/infra

            if [ -d "mosquitto/passwd" ]; then
              echo "-> Removing incorrect directory mosquitto/passwd..."
              sudo rm -rf mosquitto/passwd
            fi

            if [ ! -f "mosquitto/passwd" ]; then
              echo "-> Generating Mosquitto password file..."
              if [ -f ".env" ]; then
                set -a
                source .env
                set +a
                if [ ! -z "$MQTT_USER" ] && [ ! -z "$MQTT_PASSWORD" ]; then
                  mkdir -p mosquitto
                  touch mosquitto/passwd
                  chmod 666 mosquitto/passwd
                  chmod +x generate_mqtt_passwd.sh
                  ./generate_mqtt_passwd.sh "$MQTT_USER" "$MQTT_PASSWORD"
                  ./generate_mqtt_passwd.sh "device_001" "$MQTT_PASSWORD"
                  ./generate_mqtt_passwd.sh "device_002" "$MQTT_PASSWORD"
                else
                  echo "WARNING: MQTT_USER or MQTT_PASSWORD not set in .env"
                fi
              else
                echo "WARNING: .env file not found in infra/ folder"
              fi
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo "-> Docker Compose V2 not found. Downloading from GitHub..."
              sudo mkdir -p /usr/libexec/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-linux-x86_64 -o /usr/libexec/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            fi

            # 3. Deploy MQTT SSL Certificates
            echo "-> Deploying MQTT SSL certificates..."
            chmod +x scripts/deploy-mqtt-cert.sh
            sudo ./scripts/deploy-mqtt-cert.sh "mqtt.chescloud.my.id"

            docker compose -f docker-compose.yml up -d --build

            # 4. Build the Spark image
            cd /home/ec2-user/factory-telemetry/spark-jobs
            docker build -t iot-spark:latest .

            # 5. Check Service Status
            echo "-> Checking backend status..."
            docker logs iot_backend --tail 20

            echo "-> Checking spark-analytics timer status..."
            sudo systemctl status iot-analytics.timer --no-pager -l
            sudo systemctl list-timers --all | grep iot-analytics || true

            echo "=== PRODUCTION DEPLOYMENT COMPLETED ==="

      - name: Clean Up Temporary Deploy Key from Bastion
        if: always()
        run: |
          echo "-> Cleaning up SSH Key from Bastion..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "rm -f /home/ec2-user/tmp-key.pem"

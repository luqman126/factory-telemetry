name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy Code via Rsync
        run: |
          # 1. Siapkan SSH key di Runner
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Buat folder tujuan di server jika belum ada & pastikan kepemilikan oleh ec2-user
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "mkdir -p /home/ec2-user/iot-bigdata-project && sudo chown -R ec2-user:ec2-user /home/ec2-user/iot-bigdata-project"

          # 3. Kirim file menggunakan rsync (abaikan folder git & terraform)
          echo "-> Pushing code to staging server..."
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'infra/terraform/' \
            --exclude 'backend/.venv/' \
            --exclude 'simulator/.venv/' \
            --exclude 'spark-jobs/.venv/' \
            --exclude '*/__pycache__/' \
            ./ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/home/ec2-user/iot-bigdata-project/

      - name: Copy Temporary Deploy Key to Bastion
        run: |
          echo "-> Copying SSH Key to Bastion for DB access..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ~/.ssh/id_rsa ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/home/ec2-user/tmp-key.pem
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "chmod 600 /home/ec2-user/tmp-key.pem"

      - name: Restart Services via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            echo "=== MENJALANKAN POST-DEPLOYMENT SETUP ==="
            cd /home/ec2-user/iot-bigdata-project

            # 0. Fetch Secrets dari SSM Parameter Store ke .env
            echo "-> Fetching environment secrets from AWS SSM..."
            chmod +x infra/scripts/fetch-secrets.sh
            ./infra/scripts/fetch-secrets.sh staging

            # 1. Inisialisasi python virtual environment jika belum ada
            if [ ! -d "backend/.venv" ]; then
              echo "-> Installing Python 3.12 and creating virtual environment for backend..."
              sudo dnf install -y python3.12
              python3.12 -m venv backend/.venv
            fi

            if [ ! -d "spark-jobs/.venv" ]; then
              echo "-> Creating virtual environment for spark-jobs..."
              python3.12 -m venv spark-jobs/.venv
            fi

            # 2. Update Python dependencies (with custom TMPDIR to avoid tmpfs space limits)
            echo "-> Setting up custom TMPDIR for pip installs..."
            mkdir -p /home/ec2-user/tmp
            export TMPDIR=/home/ec2-user/tmp

            echo "-> Updating backend dependencies..."
            /home/ec2-user/iot-bigdata-project/backend/.venv/bin/pip install --upgrade pip
            /home/ec2-user/iot-bigdata-project/backend/.venv/bin/pip install -r backend/requirements.txt

            echo "-> Updating spark-jobs dependencies..."
            /home/ec2-user/iot-bigdata-project/spark-jobs/.venv/bin/pip install --upgrade pip
            /home/ec2-user/iot-bigdata-project/spark-jobs/.venv/bin/pip install -r spark-jobs/requirements.txt

            # 3. Setup & Restart systemd service iot-backend
            echo "-> Setting up systemd iot-backend service..."
            sudo cp /home/ec2-user/iot-bigdata-project/infra/systemd/iot-backend.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable iot-backend
            echo "-> Restarting systemd iot-backend service..."
            sudo systemctl restart iot-backend

            # 3b. Setup & Enable systemd service & timer untuk Spark Analytics
            echo "-> Setting up systemd iot-analytics service and timer..."
            sudo chmod +x /home/ec2-user/iot-bigdata-project/spark-jobs/run_hourly_pipeline.sh
            sudo cp /home/ec2-user/iot-bigdata-project/infra/systemd/iot-analytics.service /etc/systemd/system/
            sudo cp /home/ec2-user/iot-bigdata-project/infra/systemd/iot-analytics.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now iot-analytics.timer

            # 4. Restart Docker Compose services (Mosquitto, Grafana, Prometheus)
            echo "-> Restarting Docker Compose containers..."
            cd /home/ec2-user/iot-bigdata-project/infra

            if [ -d "mosquitto/passwd" ]; then
              echo "-> Removing incorrect directory mosquitto/passwd..."
              sudo rm -rf mosquitto/passwd
            fi

            if [ ! -f "mosquitto/passwd" ]; then
              echo "-> Generating Mosquitto password file..."
              if [ -f ".env" ]; then
                set -a
                source .env
                set +a
                if [ ! -z "$MQTT_USER" ] && [ ! -z "$MQTT_PASSWORD" ]; then
                  mkdir -p mosquitto
                  touch mosquitto/passwd
                  chmod 666 mosquitto/passwd
                  chmod +x generate_mqtt_passwd.sh
                  ./generate_mqtt_passwd.sh "$MQTT_USER" "$MQTT_PASSWORD"
                  ./generate_mqtt_passwd.sh "device_001" "$MQTT_PASSWORD"
                  ./generate_mqtt_passwd.sh "device_002" "$MQTT_PASSWORD"
                else
                  echo "WARNING: MQTT_USER or MQTT_PASSWORD not set in .env"
                fi
              else
                echo "WARNING: .env file not found in infra/ folder"
              fi
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo "-> Docker Compose V2 not found. Downloading from GitHub..."
              sudo mkdir -p /usr/libexec/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-linux-x86_64 -o /usr/libexec/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            fi

            # 4b. Deploy MQTT SSL Certificates
            echo "-> Deploying MQTT SSL certificates..."
            chmod +x scripts/deploy-mqtt-cert.sh
            sudo ./scripts/deploy-mqtt-cert.sh "staging-mqtt.chescloud.my.id"

            docker compose up -d --build

            # 5. Cek Status Service
            echo "-> Checking backend status..."
            sudo systemctl status iot-backend --no-pager -l

            echo "-> Checking spark-analytics timer status..."
            sudo systemctl status iot-analytics.timer --no-pager -l
            sudo systemctl list-timers --all | grep iot-analytics || true

            echo "=== DEPLOYMENT STAGING SELESAI ==="

      - name: Clean Up Temporary Deploy Key from Bastion
        if: always()
        run: |
          echo "-> Cleaning up SSH Key from Bastion..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "rm -f /home/ec2-user/tmp-key.pem"
